<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7A0E14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>THE LIFT DEPT. · Team Race Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #7A0E14;
      --maroon-deep: #3A080C;
      --maroon-mid: #5C0C11;
      --red: #D7262E;
      --red-hot: #FF3B3B;
      --gold: #E8B923;
      --gold-bright: #FFD166;
      --amber: #F5B942;
      --teal: #2EC4B6;
      --purple: #9B5DE5;
      --orange: #F77F00;
      --silver: #C5CDD6;
      --bronze: #CD7F32;
      --white: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.72);
      --faint: rgba(255, 255, 255, 0.45);
      --lane: rgba(0, 0, 0, 0.32);
      --line: rgba(255, 255, 255, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #3A080C;
      color: var(--white);
      font-family: "Bebas Neue", "Anton", Impact, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body { overflow: hidden; }

    button, input { font-family: inherit; color: inherit; }

    .stage {
      min-height: 100%;
      height: 100%;
      overflow: auto;
      padding: 16px 20px 20px;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(215, 38, 46, 0.45), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(232, 185, 35, 0.12), transparent 55%),
        linear-gradient(180deg, #4A0A0E 0%, #7A0E14 42%, #3A080C 100%);
    }

    body.tv-rotate { overflow: hidden; }

    body.tv-rotate .stage {
      position: fixed;
      top: 0;
      left: 100vw;
      width: 100vh;
      height: 100vw;
      transform: rotate(-90deg);
      transform-origin: top left;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand { min-width: 0; }

    .wordmark {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(28px, 4.2vw, 56px);
      letter-spacing: 0.08em;
      line-height: 0.9;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 2px;
      font-size: clamp(12px, 1.6vw, 16px);
      letter-spacing: 0.28em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .product {
      margin-top: 6px;
      display: inline-block;
      padding: 3px 10px;
      border: 1px solid rgba(215, 38, 46, 0.8);
      background: rgba(215, 38, 46, 0.25);
      color: var(--white);
      font-size: clamp(12px, 1.4vw, 16px);
      letter-spacing: 0.18em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      padding-top: 4px;
    }

    .lead {
      text-align: right;
      min-width: 120px;
    }

    .lead-label {
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--faint);
    }

    .lead-time {
      font-family: "Anton", sans-serif;
      font-size: clamp(28px, 4vw, 48px);
      letter-spacing: 0.04em;
      line-height: 0.9;
      font-variant-numeric: tabular-nums;
    }

    .lead-time.amber { color: var(--amber); }
    .lead-time.red { color: var(--red-hot); }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 15px;
      letter-spacing: 0.08em;
      color: var(--muted);
      min-height: 44px;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .switch {
      width: 52px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--line);
      position: relative;
      flex-shrink: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s ease;
    }

    .toggle input:checked + .switch {
      background: var(--red);
      border-color: var(--red);
    }

    .toggle input:checked + .switch::after { transform: translateX(22px); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-start;
      align-items: center;
      margin: 14px 0 14px;
      flex-shrink: 0;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      min-height: 56px;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 20px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      border: 1px solid var(--line);
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:not(:disabled):active { transform: scale(0.98); }

    .btn-primary {
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 8px 24px rgba(215, 38, 46, 0.4);
    }

    .btn-ghost { background: transparent; }

    .cap-field {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-left: auto;
    }

    .cap-field input {
      width: 72px;
      min-height: 48px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--white);
      font-size: 22px;
      letter-spacing: 0.06em;
      text-align: center;
    }

    .cap-field input:disabled { opacity: 0.55; }

    .lanes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      flex: 1 1 auto;
      align-content: stretch;
      min-height: 0;
    }

    @media (max-width: 800px) {
      .lanes { grid-template-columns: 1fr; }
      .cap-field { margin-left: 0; }
    }

    body.tv-rotate .lanes { grid-template-columns: 1fr; }

    .card {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      padding: 14px 16px 16px;
      border-radius: 14px;
      background: var(--lane);
      border: 1px solid var(--line);
      border-top: 8px solid var(--accent, var(--red));
      min-height: 0;
    }

    .card.done { background: rgba(255, 255, 255, 0.08); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .place {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      letter-spacing: 0.04em;
      color: var(--faint);
      border: 2px solid var(--line);
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.2);
    }

    .place.gold {
      color: #1a1200;
      background: linear-gradient(180deg, #FFE58A, #E8B923);
      border-color: #FFD166;
      box-shadow: 0 0 18px rgba(232, 185, 35, 0.55);
    }

    .place.silver {
      color: #1a1d22;
      background: linear-gradient(180deg, #F0F3F7, #A8B0BA);
      border-color: var(--silver);
      box-shadow: 0 0 14px rgba(197, 205, 214, 0.4);
    }

    .place.bronze {
      color: #1a0e04;
      background: linear-gradient(180deg, #E8A872, #CD7F32);
      border-color: #E0A05A;
      box-shadow: 0 0 14px rgba(205, 127, 50, 0.4);
    }

    .name {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 52px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      font-size: clamp(22px, 3vw, 36px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .name:focus {
      outline: none;
      border-color: var(--accent, var(--red));
      background: rgba(0, 0, 0, 0.2);
    }

    .btn-remove {
      width: 48px;
      min-height: 48px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--faint);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-remove:hover { color: var(--white); }

    .card-clock {
      font-family: "Anton", sans-serif;
      font-size: clamp(80px, 20cqw, 260px);
      letter-spacing: 0.04em;
      line-height: 0.85;
      font-variant-numeric: tabular-nums;
      color: var(--white);
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0 4px;
      transition: color 0.3s ease;
      min-height: 110px;
    }

    .card-clock.amber { color: var(--amber); }
    .card-clock.red { color: var(--red-hot); }

    .card-status {
      text-align: center;
      font-size: clamp(14px, 1.8vw, 20px);
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .card-status.amber { color: var(--amber); }
    .card-status.red { color: var(--red-hot); }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .card-actions .btn {
      flex: 1 1 auto;
      min-height: 58px;
      font-size: 22px;
      padding: 12px 16px;
    }

    .footer {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .hint {
      font-size: 14px;
      letter-spacing: 0.08em;
      color: var(--faint);
      max-width: 820px;
    }

    @media (max-width: 700px) {
      .stage { padding: 12px 12px 16px; }
      .header { flex-direction: column; }
      .lead { text-align: left; }
      .place { width: 48px; height: 48px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <header class="header">
      <div class="brand">
        <div class="wordmark">THE LIFT DEPT.</div>
        <div class="tagline">THE LIFT DEPARTMENT</div>
        <div class="product">TEAM RACE TIMER</div>
      </div>
      <div class="header-actions">
        <div class="lead" id="leadWrap" hidden>
          <div class="lead-label">LONGEST</div>
          <div class="lead-time" id="leadTime">00:00</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="rotateToggle">
          <span class="switch"></span>
          <span>ROTATE FOR PORTRAIT TV</span>
        </label>
      </div>
    </header>

    <div class="controls">
      <button class="btn btn-primary" id="startAllBtn">START ALL</button>
      <button class="btn" id="pauseAllBtn">PAUSE ALL</button>
      <button class="btn" id="resetAllBtn">RESET ALL</button>
      <label class="cap-field">
        CAP (MIN)
        <input type="number" id="capInput" min="1" value="40" inputmode="numeric">
      </label>
    </div>

    <div class="lanes" id="lanes"></div>

    <div class="footer">
      <button class="btn btn-ghost" id="addBtn">+ ADD TEAM</button>
      <p class="hint">START EACH TEAM ON ITS OWN CLOCK, OR START ALL. FINISH LOCKS THAT TEAM’S TIME. UNFINISHED TEAMS SHOW CAP AT THE TIME CAP.</p>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "tld-team-race-timer-v2";
      const STORAGE_KEY_LEGACY = "tld-team-race-timer-v1";
      const TEAM_COLORS = ["#D7262E", "#E8B923", "#2EC4B6", "#9B5DE5", "#F77F00"];
      const CAP_MIN_DEFAULT = 40;
      const PLACE_CLASS = { 1: "gold", 2: "silver", 3: "bronze" };

      const els = {
        body: document.body,
        lanes: document.getElementById("lanes"),
        startAllBtn: document.getElementById("startAllBtn"),
        pauseAllBtn: document.getElementById("pauseAllBtn"),
        resetAllBtn: document.getElementById("resetAllBtn"),
        capInput: document.getElementById("capInput"),
        addBtn: document.getElementById("addBtn"),
        rotateToggle: document.getElementById("rotateToggle"),
        leadWrap: document.getElementById("leadWrap"),
        leadTime: document.getElementById("leadTime"),
      };

      function newTeam(id, name) {
        return { id, name, finishMs: null, running: false, accum: 0, startAt: null };
      }

      const defaultTeams = () => [1, 2, 3, 4].map((n) => newTeam(n, "Team " + n));

      const state = {
        teams: defaultTeams(),
        capMin: CAP_MIN_DEFAULT,
        nextId: 5,
        rotate: false,
      };

      function fmt(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function capMs() {
        return state.capMin * 60 * 1000;
      }

      function teamElapsed(team) {
        return team.accum + (team.running && team.startAt != null ? Date.now() - team.startAt : 0);
      }

      function teamTiming(team) {
        const cap = capMs();
        const elapsed = teamElapsed(team);
        const capped = elapsed >= cap;
        const shown = Math.min(elapsed, cap);
        return { cap, elapsed, capped, shown, remaining: Math.max(0, cap - shown) };
      }

      function getTeam(id) {
        return state.teams.find((t) => t.id === id);
      }

      function anyStarted() {
        return state.teams.some((t) => t.running || teamElapsed(t) > 0 || t.finishMs != null);
      }

      function maybeApplyCaps() {
        const cap = capMs();
        let changed = false;
        for (const team of state.teams) {
          const t = teamTiming(team);
          if (team.running && t.capped) {
            team.accum = cap;
            team.startAt = null;
            team.running = false;
            changed = true;
          }
        }
        if (changed) save();
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function normalizeTeam(raw, index) {
        const fallback = newTeam(index + 1, "Team " + (index + 1));
        if (!raw || typeof raw !== "object") return fallback;
        return {
          id: typeof raw.id === "number" ? raw.id : fallback.id,
          name: typeof raw.name === "string" ? raw.name : fallback.name,
          finishMs: typeof raw.finishMs === "number" ? raw.finishMs : null,
          running: !!raw.running,
          accum: typeof raw.accum === "number" ? raw.accum : 0,
          startAt: raw.startAt === null || typeof raw.startAt === "number" ? raw.startAt : null,
        };
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY_LEGACY);
          if (!raw) return;
          const data = JSON.parse(raw);
          if (Array.isArray(data.teams) && data.teams.length) {
            state.teams = data.teams.map(normalizeTeam);
          }
          if (typeof data.capMin === "number" && data.capMin >= 1) state.capMin = data.capMin;
          if (typeof data.nextId === "number") state.nextId = data.nextId;
          if (typeof data.rotate === "boolean") state.rotate = data.rotate;
        } catch (e) {}
      }

      function places() {
        return state.teams
          .filter((t) => t.finishMs != null)
          .sort((a, b) => a.finishMs - b.finishMs);
      }

      function placeOf(id) {
        return places().findIndex((t) => t.id === id) + 1;
      }

      function startTeam(id) {
        maybeApplyCaps();
        const team = getTeam(id);
        if (!team || team.running || team.finishMs != null) return;
        const t = teamTiming(team);
        if (t.capped) return;
        team.running = true;
        team.startAt = Date.now();
        save();
        render();
      }

      function pauseTeam(id) {
        const team = getTeam(id);
        if (!team || !team.running) return;
        if (team.startAt != null) team.accum += Date.now() - team.startAt;
        team.startAt = null;
        team.running = false;
        save();
        render();
      }

      function startOrPauseTeam(id) {
        const team = getTeam(id);
        if (!team) return;
        if (team.running) pauseTeam(id);
        else startTeam(id);
      }

      function resetTeam(id) {
        const team = getTeam(id);
        if (!team) return;
        team.running = false;
        team.startAt = null;
        team.accum = 0;
        team.finishMs = null;
        save();
        render();
      }

      function startAll() {
        maybeApplyCaps();
        const now = Date.now();
        let changed = false;
        for (const team of state.teams) {
          if (team.running || team.finishMs != null) continue;
          const t = teamTiming(team);
          if (t.elapsed > 0 || t.capped) continue;
          team.running = true;
          team.startAt = now;
          changed = true;
        }
        if (changed) {
          save();
          render();
        }
      }

      function pauseAll() {
        const now = Date.now();
        let changed = false;
        for (const team of state.teams) {
          if (!team.running) continue;
          if (team.startAt != null) team.accum += now - team.startAt;
          team.startAt = null;
          team.running = false;
          changed = true;
        }
        if (changed) {
          save();
          render();
        }
      }

      function resetAll() {
        for (const team of state.teams) {
          team.running = false;
          team.startAt = null;
          team.accum = 0;
          team.finishMs = null;
        }
        save();
        render();
      }

      function setCap(value) {
        if (anyStarted()) return;
        state.capMin = Math.max(1, Number(value) || 1);
        save();
        render();
      }

      function finish(id) {
        maybeApplyCaps();
        const team = getTeam(id);
        if (!team || team.finishMs != null) return;
        const t = teamTiming(team);
        if (t.elapsed <= 0 || t.capped) return;
        team.finishMs = t.shown;
        team.accum = t.shown;
        team.startAt = null;
        team.running = false;
        save();
        render();
      }

      function undo(id) {
        const team = getTeam(id);
        if (!team) return;
        team.finishMs = null;
        save();
        render();
      }

      function rename(id, name) {
        const team = getTeam(id);
        if (!team) return;
        team.name = name;
        save();
      }

      function addTeam() {
        const id = state.nextId++;
        const name = "Team " + (state.teams.length + 1);
        state.teams = state.teams.concat([newTeam(id, name)]);
        save();
        render();
      }

      function removeTeam(id) {
        if (state.teams.length <= 1) return;
        state.teams = state.teams.filter((t) => t.id !== id);
        save();
        render();
      }

      function setRotate(on) {
        state.rotate = !!on;
        save();
        render();
      }

      function clockClass(t) {
        if (t.capped) return "red";
        if (t.remaining <= 5 * 60 * 1000 && t.elapsed > 0) return "amber";
        return "";
      }

      function teamStatus(team, t) {
        if (team.finishMs != null) return "FINISHED";
        if (t.capped) return "TIME CAP";
        if (team.running) return "RUNNING · " + fmt(t.remaining) + " LEFT";
        if (t.elapsed > 0) return "PAUSED · " + fmt(t.remaining) + " LEFT";
        return "READY";
      }

      function longestTiming() {
        let best = null;
        for (const team of state.teams) {
          const t = teamTiming(team);
          if (t.elapsed <= 0 && team.finishMs == null) continue;
          if (!best || t.shown > best.shown) best = t;
        }
        return best;
      }

      function idleCount() {
        return state.teams.filter((team) => {
          const t = teamTiming(team);
          return !team.running && team.finishMs == null && t.elapsed <= 0 && !t.capped;
        }).length;
      }

      function escapeAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function render() {
        maybeApplyCaps();

        els.capInput.value = String(state.capMin);
        els.capInput.disabled = anyStarted();
        els.rotateToggle.checked = state.rotate;
        els.body.classList.toggle("tv-rotate", state.rotate);

        const runningAny = state.teams.some((t) => t.running);
        els.startAllBtn.disabled = idleCount() === 0;
        els.pauseAllBtn.disabled = !runningAny;

        const lead = longestTiming();
        if (lead) {
          const c = clockClass(lead);
          els.leadWrap.hidden = false;
          els.leadTime.textContent = lead.capped ? "CAP" : fmt(lead.shown);
          els.leadTime.className = "lead-time" + (c ? " " + c : "");
        } else {
          els.leadWrap.hidden = true;
          els.leadTime.textContent = "00:00";
          els.leadTime.className = "lead-time";
        }

        const active = document.activeElement;
        const activeId = active && active.dataset && active.dataset.teamId;
        const selStart = active && active.selectionStart;
        const selEnd = active && active.selectionEnd;

        els.lanes.innerHTML = state.teams.map((team, index) => {
          const t = teamTiming(team);
          const done = team.finishMs != null;
          const place = done ? placeOf(team.id) : 0;
          const accent = TEAM_COLORS[index % TEAM_COLORS.length];
          const placeClass = PLACE_CLASS[place] || "";
          const cClass = clockClass(t);
          const timeText = done ? fmt(team.finishMs) : t.capped ? "CAP" : fmt(t.shown);
          const startLabel = team.running ? "PAUSE" : t.elapsed > 0 ? "RESUME" : "START";
          const startDisabled = done || t.capped;
          const finishBtn = done
            ? `<button class="btn btn-ghost" data-act="undo" data-id="${team.id}">UNDO</button>`
            : `<button class="btn btn-primary" data-act="finish" data-id="${team.id}" ${t.elapsed <= 0 || t.capped ? "disabled" : ""}>FINISH</button>`;
          return `<article class="card${done ? " done" : ""}" style="--accent:${accent}">
            <div class="card-top">
              <div class="place${placeClass ? " " + placeClass : ""}">${done ? "#" + place : "–"}</div>
              <input class="name" data-team-id="${team.id}" value="${escapeAttr(team.name)}" aria-label="Team name">
              <button class="btn-remove" data-act="remove" data-id="${team.id}" aria-label="Remove ${escapeAttr(team.name)}">✕</button>
            </div>
            <div class="card-clock${cClass ? " " + cClass : ""}">${timeText}</div>
            <div class="card-status${cClass ? " " + cClass : ""}">${teamStatus(team, t)}</div>
            <div class="card-actions">
              <button class="btn btn-primary" data-act="toggle" data-id="${team.id}" ${startDisabled ? "disabled" : ""}>${startLabel}</button>
              ${finishBtn}
              <button class="btn" data-act="reset" data-id="${team.id}">RESET</button>
            </div>
          </article>`;
        }).join("");

        if (activeId) {
          const input = els.lanes.querySelector('input[data-team-id="' + activeId + '"]');
          if (input) {
            input.focus();
            try { input.setSelectionRange(selStart, selEnd); } catch (e) {}
          }
        }
      }

      els.startAllBtn.addEventListener("click", startAll);
      els.pauseAllBtn.addEventListener("click", pauseAll);
      els.resetAllBtn.addEventListener("click", resetAll);
      els.addBtn.addEventListener("click", addTeam);
      els.capInput.addEventListener("change", (e) => setCap(e.target.value));
      els.capInput.addEventListener("input", (e) => {
        if (anyStarted()) return;
        state.capMin = Math.max(1, Number(e.target.value) || 1);
        save();
      });
      els.rotateToggle.addEventListener("change", (e) => setRotate(e.target.checked));

      els.lanes.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-act]");
        if (!btn) return;
        const id = Number(btn.dataset.id);
        if (btn.dataset.act === "toggle") startOrPauseTeam(id);
        if (btn.dataset.act === "finish") finish(id);
        if (btn.dataset.act === "undo") undo(id);
        if (btn.dataset.act === "reset") resetTeam(id);
        if (btn.dataset.act === "remove") removeTeam(id);
      });

      els.lanes.addEventListener("input", (e) => {
        if (!e.target.matches(".name")) return;
        rename(Number(e.target.dataset.teamId), e.target.value);
      });

      window.TLDTimer = {
        state,
        startTeam,
        pauseTeam,
        startOrPauseTeam,
        resetTeam,
        startAll,
        pauseAll,
        resetAll,
        setCap,
        finish,
        undo,
        addTeam,
        removeTeam,
        setRotate,
        teamTiming,
        teamElapsed,
        fmt,
        render,
        save,
        load,
        placeOf,
      };

      load();
      maybeApplyCaps();
      render();
      setInterval(() => {
        if (state.teams.some((t) => t.running)) render();
      }, 200);
    })();
  </script>
</body>
</html>
